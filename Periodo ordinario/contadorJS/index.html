<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contador con limite</title>
    <link rel="stylesheet" href="style.css" />
</head>
<body>
    <main class="container">
        <section class="counter">
            <h1>Contador</h1>
            <p id="count">0</p>
        </section>
        <section class="controls">
            <button id="btnDec" type="button">- Restar</button>
            <button id="btnInc" type="button">+ Sumar</button>
        </section>
        <section class="clicks">
            <p>Clicks en Sumar: <span id="incCount">0</span></p>
            <p>Clicks en Restar: <span id="decCount">0</span></p>
        </section>
    </main>
    <script src="programa1.js"></script>
</body>
</html>
